<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-991 Scientific Calculator</title>
<style>
:root{--page:#1b1d22;--ink:#e8e8e4;--case:linear-gradient(160deg,#34373e,#1d1f24);--lcd:#c5cfb0;--lcdink:#1f261a;--panel:#262930}
[data-theme=light]{--page:#d9dadd;--ink:#222;--case:linear-gradient(160deg,#8a8f99,#5d626c);--panel:#f0f0ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;justify-content:center;padding:12px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;width:100%}
.calc{width:min(100%,410px);background:var(--case);border-radius:22px 22px 40px 40px;padding:12px 12px 18px;box-shadow:0 14px 40px #0008,inset 0 1px #fff3}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#ddd;margin-bottom:8px}
.top b{letter-spacing:.5px}.top button{background:#0004;color:#eee;border:1px solid #fff3;border-radius:8px;padding:5px 9px;margin-left:4px;cursor:pointer;font:inherit;font-size:12px}
.solar{height:26px;border-radius:5px;margin-bottom:10px;background:repeating-linear-gradient(90deg,#1a2540 0 22px,#0c1220 22px 24px);border:2px solid #0008;box-shadow:inset 0 0 8px #000a}
.lcd{background:var(--lcd);color:var(--lcdink);border-radius:8px;padding:6px 10px 8px;margin-bottom:12px;box-shadow:inset 0 3px 8px #0006;font-family:"Lucida Console","Courier New",monospace}
.ind{display:flex;gap:10px;font-size:10px;height:14px;font-weight:bold}.ind span{opacity:.15}.ind span.on{opacity:1}
#l1{font-size:20px;min-height:30px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;line-height:30px}
#l1::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--lcdink);vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#l2{font-size:28px;text-align:right;min-height:40px;line-height:40px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.g{display:grid;gap:7px 6px}.g6{grid-template-columns:repeat(6,1fr);margin-bottom:8px}.g5{grid-template-columns:repeat(5,1fr)}
.ann{display:flex;justify-content:space-between;font-size:10px;height:13px;padding:0 2px;font-weight:bold}
.sl{color:#f2c640}.al{color:#ff7a6e}
.k{width:100%;min-height:44px;border:0;border-radius:9px;font:600 14px "Trebuchet MS",sans-serif;cursor:pointer;color:#fff;background:#3a3d46;box-shadow:0 3px 0 #0009,inset 0 1px #fff3;transition:transform .06s,box-shadow .06s}
.k:active{transform:translateY(3px);box-shadow:0 0 0 #0009}
.k:focus-visible{outline:2px solid #f2c640;outline-offset:2px}
.k.num{background:#f1f1ec;color:#1b1b1b;font-size:18px}.k.opk{background:#cfd1cb;color:#1b1b1b;font-size:18px}
.k.shift{background:#e8c33a;color:#222}.k.alpha{background:#c62828}.k.del{background:#3c78c8}.k.ac{background:#e65100}
.k.eq{background:#2f7d4f;font-size:20px}.k.on{outline:2px solid #fff}
.k.lit{color:#f2c640}
.hist{width:min(100%,300px);background:var(--panel);border-radius:14px;padding:10px;max-height:520px;overflow:auto}
.hist h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.hist h2 button{font-size:11px}
.hi{border-bottom:1px solid #8883;padding:5px 0;display:flex;flex-direction:column}
.hi button{background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:13px "Lucida Console",monospace;padding:2px;border-radius:4px;overflow-wrap:anywhere}
.hi button:hover{background:#8883}.hi .hr{text-align:right;font-weight:bold}
@media(max-width:700px){.hist{max-height:200px}.k{min-height:46px}}
@media(prefers-reduced-motion:reduce){.caret{animation:none}.k{transition:none}}
[hidden]{display:none!important}
.top select{background:#0004;color:#eee;border:1px solid #fff3;border-radius:8px;padding:5px;font:inherit;font-size:12px}
.mp{background:var(--lcd);color:var(--lcdink);border-radius:10px;padding:10px;font-family:"Lucida Console","Courier New",monospace;font-size:14px}
.mp h3{margin:0 0 6px;font-size:15px}
.mp input,.mp textarea,.mp select{width:100%;background:#fff8;border:1px solid #0004;border-radius:6px;padding:7px;font:inherit;color:inherit;margin:3px 0}
.mp label{display:block}.ef{display:grid;gap:4px;margin:4px 0}.ef input{min-width:0}
.mp #go{margin:8px 0}.mo div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #0002;padding:3px 0}
.mo b{text-align:right;overflow-wrap:anywhere}
#l2 sup{font-size:.6em;vertical-align:.5em}
</style>
</head>
<body>
<div class="wrap">
<main class="calc" aria-label="Scientific calculator">
  <div class="top"><b>LIBRA calc fx-991</b><span><select id="mode" aria-label="Mode"></select><button id="thm" aria-label="Toggle light and dark theme">Theme</button><button id="hbtn" aria-label="Show or hide history">History</button></span></div>
  <div class="solar" aria-hidden="true"></div>
  <div class="lcd" role="region" aria-label="Display">
    <div class="ind" aria-hidden="true"><span data-i="S">S</span><span data-i="A">A</span><span data-i="M">M</span><span data-i="HYP">hyp</span><span data-i="DEG">DEG</span><span data-i="RAD">RAD</span><span data-i="GRAD">GRAD</span><span data-i="FIX">FIX</span><span data-i="SCI">SCI</span></div>
    <div id="l1" aria-label="Expression"></div>
    <div id="l2" aria-live="polite" aria-label="Result">0</div>
  </div>
  <div class="mp" id="mp" hidden></div>
  <div class="g g6" id="k6"></div>
  <div class="g g5" id="k5"></div>
</main>
<aside class="hist" id="hist" aria-label="Calculation history"><h2>History <button class="k" id="hclr" style="width:auto;min-height:26px;padding:0 8px" aria-label="Clear history">Clear</button></h2><div id="hl"></div></aside>
</div>
<script>
'use strict';
/* ============ 1. STATE ============ */
const KEY='casio-calc-v1';
const st={s:'',c:0,ans:0,vars:{A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0},shift:false,alpha:false,hyp:false,sto:false,
  angle:'DEG',sci:false,fix:null,mode:'Calculate',theme:'dark',hist:[],hIdx:-1,res:'0',done:false,showFrac:false,improper:false};
let side=null; // extra output of Pol/Rec: [name1,val1,name2,val2]

/* ============ 2. ERRORS & NUMERIC HELPERS ============ */
const ME=()=>Object.assign(new Error('Math'),{kind:'Math'});
const SE=()=>Object.assign(new Error('Syntax'),{kind:'Syntax'});
const r12=x=>x===0?0:Number(x.toPrecision(12));            // kill floating-point noise
const chk=x=>{if(!isFinite(x))throw ME();return r12(x)};
const tiny=x=>Math.abs(x)<1e-14?0:x;                        // sin(180°) -> 0
const toRad=x=>st.angle==='DEG'?x*Math.PI/180:st.angle==='GRAD'?x*Math.PI/200:x;
const fromRad=x=>st.angle==='DEG'?x*180/Math.PI:st.angle==='GRAD'?x*200/Math.PI:x;
const fact=n=>{if(n<0||!Number.isInteger(n)||n>170)throw ME();let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const nCr=(n,r)=>{if(n<0||r<0||r>n||!Number.isInteger(n)||!Number.isInteger(r))throw ME();r=Math.min(r,n-r);let v=1;for(let i=1;i<=r;i++)v=v*(n-r+i)/i;return Math.round(v)};
const nPr=(n,r)=>{if(n<0||r<0||r>n||!Number.isInteger(n)||!Number.isInteger(r))throw ME();let v=1;for(let i=0;i<r;i++)v*=n-i;return v};
const pw=(b,e)=>{if(b===0&&e<=0)throw ME();if(b<0&&!Number.isInteger(e))throw ME();return chk(Math.pow(b,e))};
const root=(n,x)=>{if(n===0)throw ME();if(x<0){if(Number.isInteger(n)&&n%2!==0)return -Math.pow(-x,1/n);throw ME()}return Math.pow(x,1/n)};

/* ============ 3. FUNCTION TABLE [arity, fn] ============ */
const FN={
 'sin':[1,x=>tiny(Math.sin(toRad(x)))],'cos':[1,x=>tiny(Math.cos(toRad(x)))],
 'tan':[1,x=>{const q=st.angle==='DEG'?180:st.angle==='GRAD'?200:Math.PI;const r=((x%q)+q)%q;if(Math.abs(r-q/2)<1e-9)throw ME();return tiny(Math.tan(toRad(x)))}],
 'sin⁻¹':[1,x=>{if(Math.abs(x)>1)throw ME();return fromRad(Math.asin(x))}],
 'cos⁻¹':[1,x=>{if(Math.abs(x)>1)throw ME();return fromRad(Math.acos(x))}],
 'tan⁻¹':[1,x=>fromRad(Math.atan(x))],
 'sinh':[1,Math.sinh],'cosh':[1,Math.cosh],'tanh':[1,Math.tanh],'sinh⁻¹':[1,Math.asinh],
 'cosh⁻¹':[1,x=>{if(x<1)throw ME();return Math.acosh(x)}],
 'tanh⁻¹':[1,x=>{if(Math.abs(x)>=1)throw ME();return Math.atanh(x)}],
 'log':[1,x=>{if(x<=0)throw ME();return Math.log10(x)}],'ln':[1,x=>{if(x<=0)throw ME();return Math.log(x)}],
 'logb':[2,(a,x)=>{if(a<=0||a===1||x<=0)throw ME();return Math.log(x)/Math.log(a)}],
 '√':[1,x=>{if(x<0)throw ME();return Math.sqrt(x)}],'∛':[1,Math.cbrt],'Abs':[1,Math.abs],
 'Rnd':[1,x=>Number(x.toPrecision(10))],
 'Pol':[2,(x,y)=>{const r=Math.hypot(x,y),t=fromRad(Math.atan2(y,x));st.vars.X=r;st.vars.Y=t;side=['r',r,'θ',t];return r}],
 'Rec':[2,(r,t)=>{const x=r*tiny(Math.cos(toRad(t))),y=r*tiny(Math.sin(toRad(t)));st.vars.X=x;st.vars.Y=y;side=['x',x,'y',y];return x}]
};

/* ============ 4. TOKENIZER ============ */
const ALLW=[...Object.keys(FN).map(w=>[w,'f']),...['Ran#','Ans','π','e','A','B','C','D','E','F','X','Y','M'].map(w=>[w,'c']),
  ...['nPr','nCr','ˣ√'].map(w=>[w,'o'])].sort((a,b)=>b[0].length-a[0].length); // longest match first
const OPS={'+':'+','-':'-','−':'-','×':'*','*':'*','÷':'/','/':'/','^':'^','(':'(',')':')','!':'!','%':'%',',':',','⌟':'⌟','°':'°','′':'′','″':'″','⁻¹':'⁻¹'};
const NUM=/^(?:\d+\.?\d*|\.\d+)(?:ᴇ[+\-−]?\d+)?/;
function tokenize(src){
  const t=[];let i=0;
  while(i<src.length){
    const ch=src[i];if(ch===' '){i++;continue}
    const rest=src.slice(i),m=NUM.exec(rest);
    if(m){t.push({t:'n',v:parseFloat(m[0].replace('ᴇ','e').replace('−','-'))});i+=m[0].length;continue}
    const w=ALLW.find(([x])=>src.startsWith(x,i));
    if(w){t.push({t:w[1],v:w[0]});i+=w[0].length;continue}
    const o=src.startsWith('⁻¹',i)?'⁻¹':ch;
    if(OPS[o]){t.push({t:'o',v:OPS[o]});i+=o.length;continue}
    throw SE();
  }
  return t;
}

/* ============ 5. RECURSIVE-DESCENT PARSER ============
 expr  := term (('+'|'-') term)*
 term  := perm (('*'|'/'|implicit) perm)*
 perm  := unary (('nPr'|'nCr') unary)*
 unary := ('-'|'+') unary | pow            (so -2^2 = -(2^2))
 pow   := post (('^'|'ˣ√') unary)?         (right-assoc: exponent is a unary)
 post  := atom ('!'|'%'|'⁻¹')*
 atom  := number [fraction|DMS] | const | fn args | '(' expr ')'      */
function calc(src){
  side=null;
  const tk=tokenize(src);if(!tk.length)throw SE();
  let i=0;
  const peek=()=>tk[i],isO=(p,v)=>p&&p.t==='o'&&p.v===v;
  const close=()=>{if(isO(peek(),')'))i++;else if(peek())throw SE()};   // missing ')' auto-closed at end
  const startsAtom=p=>p&&(p.t==='n'||p.t==='c'||p.t==='f'||isO(p,'('));
  function expr(){let v=term();
    while(isO(peek(),'+')||isO(peek(),'-')){const o=tk[i++].v,r=term();v=chk(o==='+'?v+r:v-r)}return v}
  function imp(){let v=perm();while(startsAtom(peek()))v=chk(v*perm());return v}   // implicit multiplication binds tighter than ÷ (1÷2π = 1/(2π))
  function term(){let v=imp();
    for(;;){const p=peek();
      if(isO(p,'*')){i++;v=chk(v*imp())}
      else if(isO(p,'/')){i++;const d=imp();if(d===0)throw ME();v=chk(v/d)}
      else return v}}
  function perm(){let v=unary();
    while(peek()&&peek().t==='o'&&(peek().v==='nPr'||peek().v==='nCr')){const o=tk[i++].v,r=unary();v=chk(o==='nPr'?nPr(v,r):nCr(v,r))}return v}
  function unary(){const p=peek();
    if(isO(p,'-')){i++;return -unary()}if(isO(p,'+')){i++;return unary()}return pow()}
  function pow(){const b=post(),p=peek();
    if(isO(p,'^')){i++;return pw(b,unary())}
    if(p&&p.t==='o'&&p.v==='ˣ√'){i++;return chk(root(b,unary()))}
    return b}
  function post(){let v=atom();
    for(;;){const p=peek();
      if(isO(p,'!')){i++;v=chk(fact(v))}else if(isO(p,'%')){i++;v=v/100}
      else if(isO(p,'⁻¹')){i++;if(v===0)throw ME();v=1/v}else return v}}
  function num(){const p=tk[i++];if(!p||p.t!=='n')throw SE();return p.v}
  function atom(){
    const t=tk[i++];if(!t)throw SE();
    if(t.t==='n'){let v=t.v;
      if(isO(peek(),'⌟')){i++;const b=num();                 // a⌟b  or  a⌟b⌟c
        if(isO(peek(),'⌟')){i++;const c=num();if(c===0)throw ME();v=v+b/c}else{if(b===0)throw ME();v=v/b}}
      const unit=p=>p&&p.t==='o'&&(p.v==='°'||p.v==='′'||p.v==='″');
      if(unit(peek())){let tot=0,cur=v;                       // degrees-minutes-seconds
        for(;;){const u=tk[i++].v;tot+=cur/(u==='°'?1:u==='′'?60:3600);
          if(peek()&&peek().t==='n'&&unit(tk[i+1]))cur=tk[i++].v;else break}
        v=tot}
      return v}
    if(t.t==='c'){const n=t.v;
      return n==='π'?Math.PI:n==='e'?Math.E:n==='Ans'?st.ans:n==='Ran#'?Math.floor(Math.random()*1000)/1000:st.vars[n]}
    if(t.t==='f'){const [ar,f]=FN[t.v],a=[];
      if(isO(peek(),'(')){i++;a.push(expr());while(isO(peek(),',m'.slice(0,1))){i++;a.push(expr())}close()}
      else a.push(post());
      if(a.length!==ar)throw SE();
      return chk(f(...a))}
    if(isO(t,'(')){const v=expr();close();return v}
    throw SE();
  }
  const v=expr();if(i<tk.length)throw SE();return chk(v);
}

/* ============ 6. FORMATTING (decimal, scientific, fraction, DMS) ============ */
const strip=s=>s.includes('.')?s.replace(/\.?0+$/,''):s;
function fmt(n){
  n=r12(n);if(n===0)return '0';
  const e=Math.floor(Math.log10(Math.abs(n)));
  if(e>=10||e<=-10||st.sci){
    let ex=e,m=(n/Math.pow(10,ex)).toPrecision(10);
    if(Math.abs(Number(m))>=10){ex++;m=(n/Math.pow(10,ex)).toPrecision(10)}
    return strip(m)+'×10^'+ex}
  if(st.fix!=null)return n.toFixed(st.fix);
  return strip(n.toFixed(Math.max(0,9-e)));
}
function toFrac(x){                                           // continued-fraction search, denominator <= 9999
  const sg=x<0?-1:1;x=Math.abs(x);let h1=1,h0=0,k1=0,k0=1,b=x;
  for(let i=0;i<30;i++){const a=Math.floor(b),h2=a*h1+h0,k2=a*k1+k0;h0=h1;h1=h2;k0=k1;k1=k2;
    if(k1>9999)return null;if(Math.abs(x-h1/k1)<=1e-10*Math.max(1,x))return[sg*h1,k1];
    b=1/(b-a);if(!isFinite(b))break}
  return null}
function fracText(v,improper){
  const f=toFrac(v);if(!f)return null;const [p,q]=f;if(q===1)return String(p);
  const ap=Math.abs(p),sg=p<0?'-':'';
  if(improper||ap<q)return sg+ap+'/'+q;
  return sg+Math.floor(ap/q)+' '+(ap%q)+'/'+q}
function dmsText(v){
  const a=Math.abs(v);let d=Math.floor(a+1e-9),mn=Math.floor((a-d)*60+1e-9),s=Number((((a-d)*60-mn)*60).toFixed(4));
  if(s>=60){s=0;mn++}if(mn>=60){mn=0;d++}
  return (v<0?'-':'')+d+'°'+mn+'′'+strip(String(s))+'″'}
const numToInput=v=>String(v).replace('e+','ᴇ').replace('e-','ᴇ-');

/* ============ 7. SELF-TEST (console: selfTest()) ============ */
function evalText(src,angle){
  const old=st.angle;if(angle)st.angle=angle;
  try{return fmt(calc(src))}catch(e){return (e.kind||'Syntax')+' ERROR'}finally{st.angle=old}}
function selfTest(){
  const T=[['sin(30) DEG',evalText('sin(30)','DEG'),'0.5'],['5!',evalText('5!'),'120'],['2^10',evalText('2^10'),'1024'],
   ['0.1+0.2',evalText('0.1+0.2'),'0.3'],['-2^2',evalText('-2^2'),'-4'],['10 nCr 3',evalText('10nCr3'),'120'],
   ['10 nPr 3',evalText('10nPr3'),'720'],['log(1000)',evalText('log(1000)'),'3'],['ln(e)',evalText('ln(e)'),'1'],
   ['sqrt(-1)',evalText('√(−1)'),'Math ERROR'],['1÷0',evalText('1÷0'),'Math ERROR'],['5+',evalText('5+'),'Syntax ERROR'],
   ['1/3 as fraction',fracText(calc('1÷3')),'1/3'],['sin⁻¹(0.5) DEG',evalText('sin⁻¹(0.5)','DEG'),'30'],
   ['sin(180) DEG',evalText('sin(180)','DEG'),'0'],['tan(90) DEG',evalText('tan(90)','DEG'),'Math ERROR'],['2π ok',evalText('2π'),'6.283185307'],
   ['auto-close',evalText('2×(3+4'),'14'],['DMS 1°30′',evalText('1°30′'),'1.5'],['1÷2π',evalText('1÷2π'),'0.1591549431'],['6÷2(1+2)',evalText('6÷2(1+2)'),'1'],['2^3^2',evalText('2^3^2'),'512'],['1.5ᴇ20 sci',evalText('1.5ᴇ20'),'1.5×10^20']];
  let f=0;T.forEach(([n,g,w])=>{const ok=g===w;if(!ok)f++;console[ok?'log':'error'](`${ok?'PASS':'FAIL'}  ${n} -> ${g}${ok?'':'  (expected '+w+')'}`)});
  console.log(f?`${f} test(s) FAILED`:`All ${T.length} tests passed`);return !f}
window.selfTest=selfTest;

/* ============ 8. EDITING & COMMANDS ============ */
const TOK_L=/([A-Za-z⁻¹√∛]+\(|Ans|Ran#|nPr|nCr|ˣ√|⁻¹|.)$/u, TOK_R=/^([A-Za-z⁻¹√∛]+\(|Ans|Ran#|nPr|nCr|ˣ√|⁻¹|.)/u;
function ins(t){
  if(st.done){st.done=false;if(/^([+\-−×÷^]|⁻¹|!|%|nPr|nCr|ˣ√)/.test(t)){st.s='Ans';st.c=3}else{st.s='';st.c=0}}
  st.s=st.s.slice(0,st.c)+t+st.s.slice(st.c);st.c+=t.length;st.hIdx=-1}
const curVal=()=>st.s.trim()?calc(st.s):st.ans;
function show(res){st.res=res}
function equals(){
  if(!st.s.trim())return;
  try{const v=calc(st.s);st.ans=v;st.showFrac=false;
    let txt=fmt(v);if(side)txt=`${side[0]}=${fmt(side[1])} ${side[2]}=${fmt(side[3])}`;
    st.hist.push({e:st.s,r:txt,v});if(st.hist.length>60)st.hist.shift();show(txt)}
  catch(e){show((e.kind||'Syntax')+' ERROR')}
  st.done=true;st.hIdx=-1}
function recall(){const h=st.hist[st.hIdx];if(h){st.s=h.e;st.c=h.e.length;st.done=false}}
function refreshFrac(){show(st.showFrac?(fracText(st.ans,st.improper)||fmt(st.ans)):fmt(st.ans))}
function store(l,sign){try{const v=curVal();st.vars[l]=sign==null?v:r12(st.vars[l]+sign*v);show(sign==null?`${fmt(v)} → ${l}`:fmt(st.vars[l]))}catch(e){show((e.kind||'Syntax')+' ERROR')}}
function act(a,sh,al){
  if(a[0]!=='@')return ins(a);
  const [cmd,arg]=a.slice(1).split(':');
  switch(cmd){
   case'shift':st.shift=!sh;break;
   case'alpha':st.alpha=!al;break;
   case'left':{st.done=false;const m=TOK_L.exec(st.s.slice(0,st.c));if(m)st.c-=m[0].length;break}
   case'right':{st.done=false;const m=TOK_R.exec(st.s.slice(st.c));if(m)st.c+=m[0].length;break}
   case'up':if(st.hist.length){st.hIdx=st.hIdx<0?st.hist.length-1:Math.max(0,st.hIdx-1);recall()}break;

    const m=t==='lin2'?2:3,M=[];for(let r=0;r<m;r++)M.push(v.slice(r*(m+1),(r+1)*(m+1)));

 Complex:{ui:()=>`${fld('cz','Expression, e.g. (1+2i)×(3−i)')}<div class="ef" style="grid-template-columns:repeat(5,1fr)">${['i','π','e','(',')','×','÷','^','√(','Abs(','Arg(','Conj(','Re(','Im(','−'].map(s=>`<button type="button" class="k opk" style="min-height:36px;font-size:14px" data-t="${s}" aria-label="Insert ${s}">${s}</button>`).join('')}</div>`,
  init(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const f=$('cz'),s=f.selectionStart??f.value.length,e=f.selectionEnd??s;
    f.value=f.value.slice(0,s)+b.dataset.t+f.value.slice(e);f.focus();const p=s+b.dataset.t.length;f.setSelectionRange(p,p)})},
  run(){const z=ccalc($('cz').value);
    return rows([['Rectangular',cfmt(z)],['Polar r ∠ θ ('+st.angle+')',fmt(Math.hypot(...z))+' ∠ '+fmt(fromRad(Math.atan2(z[1],z[0])))]])}},
 'Base-N':{ui:()=>`<label>Input base <select id="bb"><option value="10">DEC</option><option value="2">BIN</option><option value="8">OCT</option><option value="16">HEX</option></select></label>
  ${fld('b1','First value')}<label>Operation <select id="bo"><option value="">none (convert)</option><option>+</option><option>−</option><option>×</option><option>÷</option><option>AND</option><option>OR</option><option>XOR</option><option>XNOR</option><option>NOT</option><option>NEG</option></select></label>${fld('b2','Second value (binary operators)')}`,
  run(){const b=+$('bb').value,op=$('bo').value,re={2:/^[01]+$/,8:/^[0-7]+$/,10:/^-?\d+$/,16:/^[0-9A-Fa-f]+$/}[b];
    const rd=s=>{s=s.trim();if(!re.test(s))throw SE();let v=parseInt(s,b);if(b===10){if(v>2147483647||v<-2147483648)throw ME()}else{if(v>4294967295)throw ME();v|=0}return v};
    const a=rd($('b1').value);let r;
    if(op==='NOT')r=~a;else if(op==='NEG')r=-a;else if(!op)r=a;else{const c=rd($('b2').value);
      r={'+':a+c,'−':a-c,'×':a*c,'÷':c?Math.trunc(a/c):null,AND:a&c,OR:a|c,XOR:a^c,XNOR:~(a^c)}[op];if(r===null)throw ME()}
    if(r>2147483647||r<-2147483648)throw ME();r|=0;
    return rows([['DEC',r],['HEX',(r>>>0).toString(16).toUpperCase()],['BIN',(r>>>0).toString(2)],['OCT',(r>>>0).toString(8)]])}},
 Table:{ui:()=>`${fld('tf','f(X), e.g. X^2+1 (use the letter X)')}<div class="ef" style="grid-template-columns:repeat(3,1fr)">${fld('t1','Start')}${fld('t2','End')}${fld('t3','Step')}</div>`,
  run(){const f=($('tf').value||'').replace(/x/g,'X'),a=nv('t1'),b=nv('t2'),s=nv('t3');
    if(!f.trim()||s<=0||b<a)throw SE();if((b-a)/s>99)throw Object.assign(new Error('Math'),{kind:'Math'});
    const keep=st.vars.X,out=[];
    for(let i=0;a+i*s<=b+1e-12;i++){const x=r12(a+i*s);st.vars.X=x;let y;try{y=fmt(calc(f))}catch(e){y=(e.kind||'Syntax')+' ERROR'}out.push([fmt(x),y])}
    st.vars.X=keep;return rows([['X','f(X)'],...out])}}
};
function setMode(name){
  st.mode=name;save();const m=MODES[name],mp=$('mp'),calcMode=!m;
  mp.hidden=calcMode;$('k6').hidden=$('k5').hidden=!calcMode;document.querySelector('.lcd').hidden=!calcMode;
  if(calcMode)return;
  mp.innerHTML=`<h3>${name}</h3>${m.ui()}<button class="k fn" id="go" type="button">Calculate</button><div class="mo" id="mo" aria-live="polite"></div>`;
  if(m.init)m.init();
  $('go').onclick=()=>{try{$('mo').innerHTML=m.run()}catch(e){$('mo').textContent=(e.kind||'Syntax')+' ERROR'}}}
function initModes(){const sel=$('mode');['Calculate',...Object.keys(MODES)].forEach(n=>sel.add(new Option(n,n)));sel.value=st.mode==='Calculate'||MODES[st.mode]?st.mode:'Calculate';sel.onchange=()=>setMode(sel.value);setMode(sel.value)}

/* ============ 11. INIT ============ */
load();build($('k6'),K6);build($('k5'),K5);
$('thm').onclick=()=>{st.theme=st.theme==='dark'?'light':'dark';paint()};
$('hbtn').onclick=()=>{const h=$('hist');h.style.display=h.style.display==='none'?'':'none'};
$('hclr').onclick=()=>{st.hist=[];paint()};
initModes();paint();
try{selfTest()}catch(e){console.error(e)}
</script>
</body>
